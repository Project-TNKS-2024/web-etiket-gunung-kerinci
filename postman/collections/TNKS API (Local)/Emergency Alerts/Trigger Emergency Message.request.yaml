{
  "description": "Severity: low, medium, high, critical. Koordinat opsional; fallback ke GPS terakhir jika tersedia.


    Workflow lama. Payload/contoh historis belum diverifikasi terhadap audit ini; lihat Route Inventory untuk aturan source. Dilindungi guard koleksi.",
  "url": "{{base_url}}/api/emergency/trigger",
  "method": POST,
  "headers": { Authorization: "Bearer {{token}}", Content-Type: application/json },
  "body":
    {
      "type": text,
      "content": "{

        \  \"title\": \"Tersesat di jalur\",

        \  \"description\": \"Saya tersesat setelah Pos 2, kabut tebal dan tidak bisa menemukan jalur\",

        \  \"severity\": \"high\",

        \  \"latitude\": -1.698,

        \  \"longitude\": 101.265

        }"
    },
  "$kind": http-request,
  "examples": ./.resources/Trigger Emergency Message.resources/examples,
  "scripts":
    [
      {
          type: beforeRequest,
          code: "const safe = ['/up', '/api/_audit_not_found', '/api/tracking/my-position'];

            const path = '/' + pm.request.url.getPath().replace(/^\\/+/, '');

            const hasToken = Boolean(pm.variables.get('token'));

            if (pm.variables.get('allow_requests') !== 'true' &&

            \    !(pm.request.method === 'GET' && safe.includes(path) && !hasToken)) {

            \  console.warn('Dilewati: audit tidak mengirim request ini. Jalankan manual dengan allow_requests=true dan data uji.');

            \  pm.execution.skipRequest();

            }",
          language: text/javascript
        }
    ],
  order: 2000
}

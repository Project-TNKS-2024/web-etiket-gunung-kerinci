{
  "$kind": http-request,
  "name": 103 POST api-emergency-trigger,
  "method": POST,
  "url": "{{base_url}}/api/emergency/trigger",
  "order": 103000,
  "description": "Route 103: POST /api/emergency/trigger

    Action: App\\Http\\Controllers\\API\\EmergencyController@trigger

    Nama: -

    Middleware: api, Illuminate\\Auth\\Middleware\\Authenticate:sanctum

    Source lokal: app/Http/Controllers/API/EmergencyController.php

    Metadata production dibandingkan dari runtime server pada audit sebelumnya; perubahan perilaku dibaca dari source. Belum merupakan hasil uji end-to-end.

    Resolver pendaki aktif production menggunakan id_bio pengguna + booking status 6; lokal masih berbasis pemilik booking.


    Validasi literal pada metode (syarat dinamis/percabangan tetap perlu dibaca):

    - title: required|string|max:255

    - description: required|string|max:2000

    - severity: required|in:low,medium,high,critical

    - latitude: nullable|numeric|between:-90,90

    - longitude: nullable|numeric|between:-180,180


    Path parameter: -. Gunakan ID milik akun uji sendiri.\n",
  "settings": { "followRedirects": false },
  "headers": { Accept: application/json },
  "auth": { "type": bearer, "credentials": { token: "{{token}}" } },
  "body":
    {
      "type": json,
      "content": "{

        \  \"title\": \"{{title}}\",

        \  \"description\": \"{{description}}\",

        \  \"severity\": \"low\",

        \  \"latitude\": 0,

        \  \"longitude\": 0

        }"
    },
  "scripts":
    [
      {
          type: beforeRequest,
          code: "const safe = ['/up', '/api/_audit_not_found', '/api/tracking/my-position'];

            const path = '/' + pm.request.url.getPath().replace(/^\\/+/, '');

            const hasToken = Boolean(pm.variables.get('token'));

            if (pm.variables.get('allow_requests') !== 'true' &&

            \    !(pm.request.method === 'GET' && safe.includes(path) && !hasToken)) {

            \  console.warn('Dilewati: audit tidak mengirim request ini. Jalankan manual dengan allow_requests=true dan data uji.');

            \  pm.execution.skipRequest();

            }",
          language: text/javascript
        }
    ]
}

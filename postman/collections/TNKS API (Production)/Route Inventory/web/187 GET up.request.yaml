{
  "$kind": http-request,
  "name": 187 GET up,
  "method": GET,
  "url": "{{base_url}}/up",
  "order": 187000,
  "description": "Route 187: GET|HEAD /up

    Action: Closure

    Nama: -

    Middleware: -

    Metadata production dibandingkan dari runtime server pada audit sebelumnya; perubahan perilaku dibaca dari source. Belum merupakan hasil uji end-to-end.

    Tidak ada aturan validasi literal yang diekstrak dari metode. Ini tidak menjamin endpoint tanpa parameter; periksa form/source dan prasyarat sesi.


    Path parameter: -. Gunakan ID milik akun uji sendiri.\n",
  "settings": { "followRedirects": false },
  "headers": { Accept: text/html },
  "scripts":
    [
      {
          type: beforeRequest,
          code: "const safe = ['/up', '/api/_audit_not_found', '/api/tracking/my-position'];

            const path = '/' + pm.request.url.getPath().replace(/^\\/+/, '');

            const hasToken = Boolean(pm.variables.get('token'));

            if (pm.variables.get('allow_requests') !== 'true' &&

            \    !(pm.request.method === 'GET' && safe.includes(path) && !hasToken)) {

            \  console.warn('Dilewati: audit tidak mengirim request ini. Jalankan manual dengan allow_requests=true dan data uji.');

            \  pm.execution.skipRequest();

            }",
          language: text/javascript
        },
      { type: afterResponse, code: "pm.test('Audit aman: HTTP 200', () => pm.response.to.have.status(200));", language: text/javascript }
    ]
}

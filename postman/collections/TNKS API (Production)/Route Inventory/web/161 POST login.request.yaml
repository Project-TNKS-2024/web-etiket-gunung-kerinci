{
  "$kind": http-request,
  "name": 161 POST login,
  "method": POST,
  "url": "{{base_url}}/login",
  "order": 161000,
  "description": "Route 161: POST /login

    Action: App\\Http\\Controllers\\etiket\\auth\\login@actionlogin

    Nama: login.action

    Middleware: web, Illuminate\\Auth\\Middleware\\RedirectIfAuthenticated

    Source lokal: app/Http/Controllers/etiket/auth/login.php

    Metadata production dibandingkan dari runtime server pada audit sebelumnya; perubahan perilaku dibaca dari source. Belum merupakan hasil uji end-to-end.


    Validasi literal pada metode (syarat dinamis/percabangan tetap perlu dibaca):

    - email: required|email

    - password: required


    Path parameter: -. Gunakan ID milik akun uji sendiri.

    WEB/ADMIN: response dapat berupa HTML/redirect. Diperlukan cookie sesi, hak akses sesuai middleware dan _token CSRF untuk form.\n",
  "settings": { "followRedirects": false },
  "headers": { Accept: text/html },
  "body": { "type": urlencoded, "content": { email: "{{email}}", password: "{{password}}", _token: "{{csrf_token}}" } },
  "scripts":
    [
      {
          type: beforeRequest,
          code: "const safe = ['/up', '/api/_audit_not_found', '/api/tracking/my-position'];

            const path = '/' + pm.request.url.getPath().replace(/^\\/+/, '');

            const hasToken = Boolean(pm.variables.get('token'));

            if (pm.variables.get('allow_requests') !== 'true' &&

            \    !(pm.request.method === 'GET' && safe.includes(path) && !hasToken)) {

            \  console.warn('Dilewati: audit tidak mengirim request ini. Jalankan manual dengan allow_requests=true dan data uji.');

            \  pm.execution.skipRequest();

            }",
          language: text/javascript
        }
    ]
}

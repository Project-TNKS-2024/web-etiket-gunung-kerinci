{
  "description": "Reference only: channels private-emergency.{destinasi_id}, private-sos.{destinasi_id}, private-sos-chat.{sos_id}, private-tracking.{destinasi_id}; events emergency.triggered, emergency.broadcast, sos.triggered, sos.message.sent, sos.status.updated, tracking.updated, disaster.reported.


    Workflow lama. Payload/contoh historis belum diverifikasi terhadap audit ini; lihat Route Inventory untuk aturan source. Dilindungi guard koleksi.",
  "url": https://example.com/docs/websocket-reference,
  "method": GET,
  "$kind": http-request,
  "examples": ./.resources/WebSocket Channels and Events (Documentation Only).resources/examples,
  "scripts":
    [
      {
          type: beforeRequest,
          code: "const safe = ['/up', '/api/_audit_not_found', '/api/tracking/my-position'];

            const path = '/' + pm.request.url.getPath().replace(/^\\/+/, '');

            const hasToken = Boolean(pm.variables.get('token'));

            if (pm.variables.get('allow_requests') !== 'true' &&

            \    !(pm.request.method === 'GET' && safe.includes(path) && !hasToken)) {

            \  console.warn('Dilewati: audit tidak mengirim request ini. Jalankan manual dengan allow_requests=true dan data uji.');

            \  pm.execution.skipRequest();

            }",
          language: text/javascript
        }
    ],
  order: 1000
}

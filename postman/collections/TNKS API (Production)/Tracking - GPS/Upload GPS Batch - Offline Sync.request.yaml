{
  "description": Maksimal 100 posisi per request; setiap posisi wajib punya recorded_at.


    Workflow lama. Payload/contoh historis belum diverifikasi terhadap audit ini; lihat Route Inventory untuk aturan source. Dilindungi guard koleksi.,
  "url": "{{base_url}}/api/tracking/gps/batch",
  "method": POST,
  "headers": { Authorization: "Bearer {{token}}", Content-Type: application/json },
  "body":
    {
      "type": text,
      "content": "{

        \  \"positions\": [

        \    {

        \      \"latitude\": -1.6974,

        \      \"longitude\": 101.2642,

        \      \"altitude\": 2800,

        \      \"battery_level\": 80,

        \      \"recorded_at\": \"2026-05-12T08:00:00+07:00\"

        \    },

        \    {

        \      \"latitude\": -1.698,

        \      \"longitude\": 101.265,

        \      \"altitude\": 2850,

        \      \"battery_level\": 78,

        \      \"recorded_at\": \"2026-05-12T08:01:00+07:00\"

        \    }

        \  ]

        }"
    },
  "$kind": http-request,
  "examples": ./.resources/Upload GPS Batch - Offline Sync.resources/examples,
  "scripts":
    [
      {
          type: beforeRequest,
          code: "const safe = ['/up', '/api/_audit_not_found', '/api/tracking/my-position'];

            const path = '/' + pm.request.url.getPath().replace(/^\\/+/, '');

            const hasToken = Boolean(pm.variables.get('token'));

            if (pm.variables.get('allow_requests') !== 'true' &&

            \    !(pm.request.method === 'GET' && safe.includes(path) && !hasToken)) {

            \  console.warn('Dilewati: audit tidak mengirim request ini. Jalankan manual dengan allow_requests=true dan data uji.');

            \  pm.execution.skipRequest();

            }",
          language: text/javascript
        }
    ],
  order: 2000
}

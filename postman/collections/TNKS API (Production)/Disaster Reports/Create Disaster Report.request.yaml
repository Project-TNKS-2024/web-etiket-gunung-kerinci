{
  "description": Laporkan potensi bencana; lampiran opsional max 5MB.


    Workflow lama. Payload/contoh historis belum diverifikasi terhadap audit ini; lihat Route Inventory untuk aturan source. Dilindungi guard koleksi.,
  "url": "{{base_url}}/api/sos/disaster-report",
  "method": POST,
  "headers": { Authorization: "Bearer {{token}}" },
  "body": { "type": formdata, "content": [ { type: text, key: potensi_bencana, value: Longsor }, { type: text, key: deskripsi, value: "Terlihat retakan tanah besar di jalur, lebar sekitar 2 meter" }, { type: text, key: lokasi, value: "Antara Pos 2 dan Pos 3, sebelah kanan jalur" }, { type: text, key: latitude, value: "-1.6985" }, { type: text, key: longitude, value: "101.2640" }, { type: file, key: lampiran, src: /path/to/foto_retakan.jpg } ] },
  "$kind": http-request,
  "examples": ./.resources/Create Disaster Report.resources/examples,
  "scripts":
    [
      {
          type: beforeRequest,
          code: "const safe = ['/up', '/api/_audit_not_found', '/api/tracking/my-position'];

            const path = '/' + pm.request.url.getPath().replace(/^\\/+/, '');

            const hasToken = Boolean(pm.variables.get('token'));

            if (pm.variables.get('allow_requests') !== 'true' &&

            \    !(pm.request.method === 'GET' && safe.includes(path) && !hasToken)) {

            \  console.warn('Dilewati: audit tidak mengirim request ini. Jalankan manual dengan allow_requests=true dan data uji.');

            \  pm.execution.skipRequest();

            }",
          language: text/javascript
        }
    ],
  order: 1000
}
